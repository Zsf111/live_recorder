<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Live Recorder{% endblock %}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #0f1117; }
  :root { color-scheme: dark; --bg: #0b0d10; --surface: #14171c; --surface-2: #1b1f26; --line: #2a3039; --text: #edf1f5; --muted: #9aa4b2; --accent: #79d49c; --accent-strong: #a1e5b8; --danger: #ff766d; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; overflow-x: hidden; }
  nav { background: rgba(11,13,16,.88); border-bottom: 1px solid var(--line); padding: 0 12px; display: flex; align-items: center; gap: 14px; height: 58px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; backdrop-filter: blur(16px); position: sticky; top: 0; z-index: 20; }
  nav a { color: var(--muted); text-decoration: none; font-size: 13px; flex-shrink: 0; padding: 7px 10px; border-radius: 8px; }
  nav a:hover, nav a.active { color: var(--text); background: var(--surface-2); }
  nav .brand { font-weight: 700; letter-spacing: -.02em; color: var(--text); margin-right: auto; font-size: 15px; flex-shrink: 0; }
  nav .logout { color: var(--danger); }
  .container { max-width: 1100px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  h1 { font-size: 24px; font-weight: 650; letter-spacing: -.035em; margin-bottom: 16px; }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -16px; padding: 0 16px; }
  table { width: 100%; border-collapse: collapse; min-width: 500px; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #21262d; font-size: 13px; }
  th { color: #8b949e; font-weight: 500; font-size: 12px; white-space: nowrap; }
  tr:hover { background: #161b22; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; white-space: nowrap; }
  .badge-recording { background: #da3633; color: #fff; }
  .badge-live { background: #1f6feb; color: #fff; }
  .badge-offline { background: #30363d; color: #8b949e; }
  .badge-success { background: #238636; color: #fff; }
  .btn { display: inline-flex; align-items: center; justify-content: center; padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: #d8dee6; cursor: pointer; font-size: 13px; text-decoration: none; white-space: nowrap; transition: transform .18s ease, background .18s ease, border-color .18s ease; }
  .btn:hover { background: #30363d; }
  .btn:active { transform: scale(.98); }
  .btn-danger { color: #f85149; border-color: #f85149; background: transparent; }
  .btn-danger:hover { background: #f85149; color: #fff; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #102117; font-weight: 650; }
  .btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  input, select { padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: #101319; color: #d8dee6; font-size: 13px; }
  input:focus, select:focus { outline: 2px solid rgba(121,212,156,.22); border-color: var(--accent); }
  .flex-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin-bottom: 14px; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px 14px; }
  .stat-value { font-size: 22px; font-weight: 600; color: #f0f6fc; }
  .stat-label { font-size: 12px; color: #8b949e; margin-top: 2px; }
  .muted { color: #8b949e; font-size: 13px; }
  .mb { margin-bottom: 14px; }
  .flash { padding: 8px 14px; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
  .flash-ok { background: #238636; color: #fff; }
  .flash-err { background: #da3633; color: #fff; }
  .ellipsis { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mobile-label { display: none; }
  .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
  .page-heading h1 { margin-bottom: 0; }
  .page-kicker { color: var(--muted); font-size: 13px; }
  .live-stage { position: relative; overflow: hidden; min-height: 390px; margin-bottom: 28px; padding: 28px; border: 1px solid #31483a; border-radius: 16px; background: radial-gradient(circle at 82% 12%, rgba(121,212,156,.18), transparent 30%), linear-gradient(145deg, #18231d, #101419 58%); }
  .live-stage::after { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px); background-size: 34px 34px; pointer-events: none; mask-image: linear-gradient(to bottom, #000, transparent 85%); }
  .live-stage-top, .live-stage-content { position: relative; z-index: 1; }
  .live-stage-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .live-indicator { display: inline-flex; align-items: center; gap: 8px; color: #b8efca; font-size: 12px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; }
  .live-indicator::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 5px rgba(121,212,156,.12); }
  .live-stage-content { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(260px, .75fr); align-items: end; gap: 28px; min-height: 292px; }
  .live-copy h2 { max-width: 660px; margin: 10px 0 12px; font-size: clamp(36px, 6vw, 72px); line-height: .98; letter-spacing: -.065em; }
  .live-copy p { color: #aab5ae; font-size: 14px; }
  .signal-panel { padding: 18px; border: 1px solid rgba(255,255,255,.1); border-radius: 14px; background: rgba(10,13,16,.58); backdrop-filter: blur(12px); }
  .signal-title { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 18px; color: #c9d3cc; font-size: 12px; }
  .waveform { height: 86px; display: flex; align-items: center; gap: 5px; }
  .waveform span { flex: 1; min-width: 3px; height: var(--h); border-radius: 4px; background: linear-gradient(to top, #4f9367, var(--accent-strong)); transform-origin: center; }
  .recording-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 28px; }
  .recording-card { min-height: 180px; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; border: 1px solid #304539; border-radius: 14px; background: linear-gradient(145deg, #17231c, #12171a); }
  .recording-card h3 { margin-top: 26px; font-size: 24px; letter-spacing: -.035em; }
  .recording-meta { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 12px; }

  @media (prefers-reduced-motion: no-preference) {
    .live-indicator::before { animation: pulse-live 1.8s ease-in-out infinite; }
    .waveform span { animation: signal 1.6s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -110ms); }
    @keyframes pulse-live { 50% { box-shadow: 0 0 0 9px rgba(121,212,156,0); } }
    @keyframes signal { 0%, 100% { transform: scaleY(.42); opacity: .55; } 50% { transform: scaleY(1); opacity: 1; } }
  }

  @media (max-width: 600px) {
    nav { height: auto; min-height: 96px; padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left)); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 4px; overflow: visible; }
    nav .brand { grid-column: 1 / -1; margin: 0; font-size: 16px; }
    nav .version { display: none; }
    nav a { min-width: 0; padding: 7px 2px; border-radius: 6px; text-align: center; font-size: 12px; line-height: 1.2; }
    nav a.active { background: #21262d; }
    nav .logout { color: #ff7b72; }
    .container { padding-top: 20px; }
    h1 { font-size: 22px; }
    .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stat-card { min-width: 0; }
    .stat-card:last-child:nth-child(odd) { grid-column: 1 / -1; }
    .table-wrap { margin: 0; padding: 0; overflow: visible; }
    table, thead, tbody, tr, th, td { display: block; width: 100%; }
    table { min-width: 0; }
    thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    tbody { display: grid; gap: 12px; }
    tr { padding: 14px; border: 1px solid #30363d; border-radius: 10px; background: #161b22; }
    tr:hover { background: #161b22; }
    td { display: grid; grid-template-columns: minmax(70px, .7fr) minmax(0, 1.7fr); align-items: center; gap: 10px; padding: 8px 0; border: 0; border-bottom: 1px solid #21262d; overflow-wrap: anywhere; }
    td:last-child { padding-bottom: 0; border-bottom: 0; }
    td:first-child { padding-top: 0; }
    td::before { content: attr(data-label); color: #8b949e; font-size: 12px; font-weight: 500; }
    td .badge { justify-self: start; }
    td .flex-row { min-width: 0; }
    .ellipsis { max-width: none; white-space: normal; }
    .btn { min-height: 36px; }
    input, select { min-height: 42px; font-size: 16px; }
    .card .flex-row { align-items: stretch; }
    .card .flex-row > input, .card .flex-row > select, .card .flex-row > button { width: 100%; }
    td form[style*="inline"] { display: inline-flex !important; }
    td form.flex-row { width: 100%; flex-wrap: nowrap; }
    td form.flex-row input[name="name"] { width: 100% !important; min-width: 0; }
    td form .btn { min-height: 34px; }
    .login-shell { margin-top: 12px !important; }
    .page-heading { align-items: flex-start; flex-direction: column; gap: 6px; }
    .live-stage { min-height: 520px; padding: 20px; }
    .live-stage-content { grid-template-columns: 1fr; align-content: end; min-height: 430px; }
    .live-copy h2 { font-size: clamp(40px, 13vw, 58px); }
    .recording-grid { grid-template-columns: 1fr; }
  }

  @media (min-width: 601px) {
    nav { padding: 0 24px; gap: 24px; }
    nav a { font-size: 14px; }
    nav .brand { font-size: 15px; }
    .container { padding: 24px; }
    h1 { font-size: 22px; margin-bottom: 20px; }
    th, td { padding: 10px 14px; font-size: 14px; }
    th { font-size: 13px; }
    .badge { padding: 2px 10px; font-size: 12px; }
    .btn-sm { padding: 3px 10px; font-size: 12px; }
    .card { padding: 20px; margin-bottom: 16px; }
    .stat-card { padding: 14px 18px; }
    .stat-value { font-size: 26px; }
    input, select { padding: 6px 10px; }
    .table-wrap { margin: 0; padding: 0; }
  }
</style>
</head>
<body class="{% block body_class %}{% endblock %}">
{% if session.logged_in %}
<nav>
  <span class="brand">Live Recorder</span>
  <a href="/" class="{{ 'active' if request.path == '/' }}">仪表盘</a>
  <a href="/streamers" class="{{ 'active' if request.path == '/streamers' }}">主播管理</a>
  <a href="/recordings" class="{{ 'active' if request.path == '/recordings' }}">录播历史</a>
  <a href="/logout" class="logout">退出</a>
</nav>
{% endif %}
<div class="container">
{% block content %}{% endblock %}
</div>
</body>
</html>
